    name: AWS Snowball
    url: https://aws.amazon.com/snowball/
    note: Snowcone consolidated into the Snowball family
  azure:
    name: Azure Data Box
    url: https://azure.microsoft.com/en-us/products/databox/
  gcp:
    name: Transfer Appliance
    url: https://docs.cloud.google.com/transfer-appliance/docs/4.0/overview
- id: large-scale-data-transfer-solution-petabyte-scale
  name: Large Scale Data Transfer Solution (Petabyte Scale)
  verified: '2026-09-21'
  aws:
    name: AWS Snowball
    url: https://aws.amazon.com/snowball/
    note: 'also: AWS DataSync'
  azure:
    name: Azure Data Box
    url: https://azure.microsoft.com/en-us/products/databox/
  gcp:
    name: Transfer Appliance
    url: https://docs.cloud.google.com/transfer-appliance/docs/4.0/overview
- id: large-scale-data-transfer-solution-exabyte-scale
  name: Large Scale Data Transfer Solution (Exabyte Scale)
  verified: '2026-09-21'
  aws:
    name: AWS Snowball
    url: https://aws.amazon.com/snowball/
    note: Snowmobile deprecated into the Snowball family
  azure:
    name: Azure Data Box
    url: https://azure.microsoft.com/en-us/products/databox/
    note: up to ~800 TB per job; chain multiple jobs
  gcp:
    name: Transfer Appliance
    url: https://docs.cloud.google.com/transfer-appliance/docs/4.0/overview
    note: up to ~1 PB per appliance; no exabyte-scale offline product

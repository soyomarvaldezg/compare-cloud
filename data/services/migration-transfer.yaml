  aws:
    name: AWS Snowball
    url: https://aws.amazon.com/snowball/
    note: 'also: AWS Transfer Family'
  azure:
    name: Azure Import/Export
    url: https://azure.microsoft.com/en-us/pricing/details/storage-import-export/
  gcp:
    name: Storage Transfer Service
    url: https://cloud.google.com/storage-transfer-service
- id: large-scale-data-transfer-solution-terabyte-scale

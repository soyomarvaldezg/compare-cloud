    name: Amazon Simple Storage Service (S3)
    url: https://docs.aws.amazon.com/s3/
  azure:
    name: Azure Blob Storage
    url: https://azure.microsoft.com/en-us/products/storage/blobs/
  gcp:
    name: Cloud Storage
    url: https://cloud.google.com/storage

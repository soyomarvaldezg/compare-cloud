name: Monthly staleness check

on:
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: staleness

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Check all service links
        run: uv run python scripts/check_links.py --report staleness-report.md --no-fail
      - name: Create or update staleness issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="Staleness report $(date +%Y-%m)"
          existing=$(gh issue list --label staleness --state open --json number --jq '.[0].number' || true)
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --title "$TITLE" --body-file staleness-report.md
          else
            gh issue create --label staleness --title "$TITLE" --body-file staleness-report.md
          fi
